<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Cercle de fond -->
    <circle cx="60" cy="60" r="55" fill="#FFD700" stroke="#003366" stroke-width="3"/>

    <!-- Croix centrale -->
    <g stroke="#003366" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
        <!-- Barre verticale -->
        <line x1="60" y1="25" x2="60" y2="95"/>
        <!-- Barre horizontale -->
        <line x1="25" y1="60" x2="95" y2="60"/>
    </g>

    <!-- Rayons de lumi�re (optionnel) -->
    <g stroke="#003366" stroke-width="2" opacity="0.3">
        <line x1="60" y1="5" x2="60" y2="15"/>
        <line x1="60" y1="105" x2="60" y2="115"/>
        <line x1="5" y1="60" x2="15" y2="60"/>
        <line x1="105" y1="60" x2="115" y2="60"/>
    </g>

    <!-- Texte "P" stylis� (optionnel) -->
    <text x="60" y="75" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#003366" text-anchor="middle">P</text>
</svg>
